<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      rel="stylesheet"

    <title>Flatr</title>
    <script>
      // Sett valgt tema før første paint (unngår blink).
      try {
        var t = localStorage.getItem('flatr.theme');
        if (t === 'varm' || t === 'presis') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
