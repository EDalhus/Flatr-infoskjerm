# nginx på verten foran Flatr-containeren (127.0.0.1:8787).
# flatr.no + *.flatr.no går via Cloudflare-proxy (oransje sky). Sertifikatet
# er et Cloudflare Origin-sertifikat for flatr.no og *.flatr.no.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name flatr.no *.flatr.no;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) kjenner ikke `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flatr.no *.flatr.no;

    ssl_certificate     /etc/ssl/flatr/origin.pem;
    ssl_certificate_key /etc/ssl/flatr/origin.key;

    # Medieopplasting.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (live-samarbeid).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (/api/stream) må ikke bufres, og lever lenge.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_request_buffering off;
    }
}
